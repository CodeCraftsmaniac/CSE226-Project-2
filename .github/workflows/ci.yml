name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'cli_app/**'
      - 'flutter_app/**'
      - 'web_app/**'
      - 'docs/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black

      - name: Lint with flake8
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check formatting with black
        run: black --check backend
        continue-on-error: true

      - name: Run backend tests
        run: cd backend && python -m pytest tests -v --tb=short

      - name: Verify backend imports
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app; print('backend imports')"
          python -c "import sys; sys.path.insert(0, 'backend'); from core import run_full_analysis; print('analysis imports')"
          python -c "import sys; sys.path.insert(0, 'backend'); from database import get_supabase; print('database imports')"
          python -c "import sys; sys.path.insert(0, 'backend'); from auth import verify_supabase_token; print('auth imports')"

      - name: Smoke health endpoints
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend-smoke.log 2>&1 &
          PID=$!
          trap "kill $PID" EXIT
          for i in $(seq 1 20); do
            ROOT=$(curl -s -o /tmp/root.out -w "%{http_code}" http://127.0.0.1:8001/ || true)
            if [ "$ROOT" = "200" ]; then
              break
            fi
            sleep 1
          done
          ROOT=$(curl -s -o /tmp/root.out -w "%{http_code}" http://127.0.0.1:8001/ || true)
          LIVE=$(curl -s -o /tmp/live.out -w "%{http_code}" http://127.0.0.1:8001/health/live || true)
          READY=$(curl -s -o /tmp/ready.out -w "%{http_code}" http://127.0.0.1:8001/health/ready || true)
          test "$ROOT" = "200"
          test "$LIVE" = "200"
          if [ "$READY" != "200" ] && [ "$READY" != "503" ]; then
            echo "Unexpected readiness status: $READY"
            exit 1
          fi

  cli-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify CLI imports
        run: python -c "import sys; sys.path.insert(0, 'backend'); sys.path.insert(0, 'cli_app'); from cli_auth import CLIAuth; print('cli auth imports')"

      - name: Test CLI help
        run: python cli_app/main.py --help

  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Check formatting
        run: dart format --set-exit-if-changed lib
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Verify build (web)
        run: flutter build web --release
        continue-on-error: true

  webapp-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fastapi uvicorn jinja2 python-multipart

      - name: Verify web app imports
        run: python -c "from app import app; print('web app imports')"

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tooling
        run: pip install safety pip-audit

      - name: Audit dependencies
        run: |
          pip install -r requirements.txt
          pip-audit
        continue-on-error: true

      - name: Check for likely hardcoded secrets
        run: |
          ! grep -r --include="*.py" --include="*.dart" --include="*.js" --include="*.html" \
            -E "(SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|AIza[0-9A-Za-z_-]{20,}|eyJhbGciOiJIUzI1Ni)" \
            --exclude-dir=node_modules --exclude-dir=.git . \
            || echo "::warning::Potential secrets or tokens found"
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nsu-audit-api:test .

      - name: Verify Docker image
        run: docker run --rm nsu-audit-api:test python -c "from app.main import app; print('docker build verified')"
